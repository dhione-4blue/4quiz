name: Deploy 4quiz → Firebase

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy para Firebase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Deploy Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_QUIZ_27B46 }}
          channelId: live
          projectId: quiz-27b46

      - name: Deploy Firestore Rules + Indexes
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_QUIZ_27B46 }}' > /tmp/sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json
          npm install -g firebase-tools
          firebase deploy --only firestore --project quiz-27b46 --non-interactive

      - name: Concluído
        run: echo "✅ https://quiz-27b46.web.app"
