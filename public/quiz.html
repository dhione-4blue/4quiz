<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Carregando quiz…</title>
  <meta name="robots" content="noindex"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/main.css"/>
  <style>
    body { background: var(--bg-app); min-height: 100vh; }

    /* ── Tela inicial ─────────────────────────────────────────────── */
    #startScreen {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .start-hero {
      background: var(--grad-hero);
      color: var(--white);
      padding: var(--space-2xl) var(--space-lg);
      text-align: center;
      flex-shrink: 0;
    }
    .start-hero h1 { font-size: clamp(1.5rem, 5vw, 2.2rem); margin-bottom: var(--space-md); }
    .start-hero p  { opacity: 0.85; font-size: 1.05rem; max-width: 500px; margin: 0 auto; }
    .start-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--space-xl) var(--space-lg);
      gap: var(--space-md);
    }
    .start-body .info-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }
    .pill {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius-full);
      padding: 8px 16px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-dark);
      display: flex; align-items: center; gap: 6px;
    }

    /* ── Quiz player ─────────────────────────────────────────────── */
    #quizScreen { display: none; }

    .quiz-container {
      max-width: 700px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .quiz-progress-wrap {
      background: var(--grad-hero);
      padding: var(--space-lg) var(--space-xl);
      position: sticky;
      top: 0;
      z-index: 10;
      flex-shrink: 0;
    }

    .quiz-progress-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .quiz-title-label { font-size: 0.85rem; font-weight: 700; color: rgba(255,255,255,0.85); }
    .quiz-counter     { font-size: 0.85rem; color: rgba(255,255,255,0.7); }
    .quiz-motivation  { font-size: 0.8rem; color: var(--yellow-cta); font-weight: 600; margin-top: 6px; }

    .question-area {
      flex: 1;
      padding: var(--space-xl) var(--space-lg);
      display: flex;
      flex-direction: column;
      gap: var(--space-lg);
    }
    .question-text {
      font-size: clamp(1.1rem, 3vw, 1.35rem);
      font-weight: 700;
      color: var(--text-dark);
      line-height: 1.45;
    }
    .options-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .text-answer-input {
      min-height: 100px;
      resize: vertical;
    }
    .question-nav {
      display: flex;
      gap: var(--space-sm);
      justify-content: flex-end;
      padding: var(--space-md) var(--space-lg) var(--space-xl);
      flex-shrink: 0;
    }

    /* ── Keyboard hint ─────────────────────────────────────────────── */
    .keyboard-hint {
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: var(--space-sm);
    }

    /* ── Gate (captura de lead) ──────────────────────────────────── */
    #gateScreen {
      display: none;
      min-height: 100vh;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--space-xl) var(--space-lg);
    }
    .gate-card {
      background: var(--white);
      border-radius: var(--radius-lg);
      padding: var(--space-xl);
      max-width: 480px;
      width: 100%;
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border);
    }
    .gate-card h2 { margin-bottom: var(--space-sm); }
    .gate-card p  { margin-bottom: var(--space-lg); }
    .gate-form    { display: flex; flex-direction: column; gap: var(--space-md); }
    .gate-trust {
      text-align: center;
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: var(--space-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    /* Transições entre perguntas */
    .fade-out { animation: fadeOutLeft 0.2s ease forwards; }
    .fade-in  { animation: fadeInRight 0.25s ease forwards; }
    @keyframes fadeOutLeft  { to { opacity:0; transform: translateX(-20px); } }
    @keyframes fadeInRight  { from { opacity:0; transform: translateX(20px); } }
  </style>
</head>
<body>

<!-- Loading -->
<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <p>Carregando diagnóstico…</p>
</div>

<!-- Tela de start -->
<div id="startScreen" style="display:none">
  <div class="start-hero">
    <h1 id="startTitle">Diagnóstico</h1>
    <p id="startDesc"></p>
  </div>
  <div class="start-body">
    <div class="info-pills">
      <div class="pill">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--blue-primary)" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span id="quizDuration">~5 min</span>
      </div>
      <div class="pill">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--blue-primary)" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        <span id="quizQCount">Perguntas rápidas</span>
      </div>
      <div class="pill">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--yellow-hover)" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        Resultado personalizado
      </div>
    </div>
    <button class="btn btn-yellow btn-lg" id="startBtn" style="min-width:220px">
      Iniciar Diagnóstico
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
    <p class="text-sm text-muted">Gratuito e sem compromisso</p>
  </div>
</div>

<!-- Quiz screen -->
<div id="quizScreen">
  <div class="quiz-container">
    <div class="quiz-progress-wrap">
      <div class="quiz-progress-top">
        <span class="quiz-title-label" id="progressTitle"></span>
        <span class="quiz-counter" id="progressCounter"></span>
      </div>
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="progressBar" style="width:0%"></div>
      </div>
      <div class="quiz-motivation" id="motivationText"></div>
    </div>

    <div class="question-area" id="questionArea">
      <!-- Gerado dinamicamente -->
    </div>

    <div class="question-nav">
      <button class="btn btn-ghost" id="prevBtn" style="display:none">← Voltar</button>
      <button class="btn btn-primary" id="nextBtn">
        Próxima
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>
  </div>
</div>

<!-- Gate screen (captura de lead) -->
<div id="gateScreen">
  <div class="gate-card animate-in">
    <div style="text-align:center;margin-bottom:var(--space-lg)">
      <div style="font-size:2.5rem;margin-bottom:8px">🎯</div>
      <h2>Seu diagnóstico está pronto!</h2>
      <p>Para revelar seu resultado personalizado, preencha os dados abaixo. É grátis e rápido.</p>
    </div>
    <div class="gate-form">
      <div class="form-group">
        <label class="form-label">Seu nome *</label>
        <input type="text" class="form-input" id="gateName" placeholder="Como você se chama?" autocomplete="name"/>
      </div>
      <div class="form-group">
        <label class="form-label">E-mail *</label>
        <input type="email" class="form-input" id="gateEmail" placeholder="seu@email.com" autocomplete="email"/>
      </div>
      <div class="form-group">
        <label class="form-label">WhatsApp *</label>
        <input type="tel" class="form-input" id="gateWhatsapp" placeholder="(11) 99999-9999" autocomplete="tel"/>
      </div>
      <button class="btn btn-yellow btn-full btn-lg" id="gateSubmitBtn">
        Ver Meu Resultado Agora
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
      <div class="gate-trust">
        <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        Suas informações são 100% seguras. Sem spam.
      </div>
    </div>
  </div>
</div>

<div id="toast-container"></div>

<script type="module">
  import { db } from '/js/firebase-config.js';
  import {
    doc, getDoc, addDoc, updateDoc, collection,
    serverTimestamp, increment
  } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

  // ──────────────────────────────────────────────────────────────────
  // Estado global
  // ──────────────────────────────────────────────────────────────────
  const params      = new URLSearchParams(location.search);
  const quizId      = params.get('id');
  const isPreview   = params.get('preview') === '1';
  const STORAGE_KEY = `4quiz_progress_${quizId}`;

  let quizData      = null;
  let questions     = [];   // lista de perguntas a exibir (após ramificação)
  let currentIdx    = 0;    // índice atual na lista de perguntas
  let answers       = {};   // { questionId: { optionId, textAnswer, score, profile } }
  let sessionId     = Math.random().toString(36).slice(2);
  let responseDocId = null; // ID do doc de resposta já criado no Firestore
  let utms          = {};
  let dropoffRegistered = false;

  // ── UTMs ──────────────────────────────────────────────────────────
  ['source','medium','campaign','content','term'].forEach(k => {
    const val = params.get(`utm_${k}`);
    if (val) utms[k] = val;
  });

  // ── Toast ─────────────────────────────────────────────────────────
  function toast(msg, type = 'default') {
    const tc = document.getElementById('toast-container');
    const t  = document.createElement('div');
    t.className = `toast ${type}`;
    t.textContent = msg;
    tc.appendChild(t);
    setTimeout(() => { t.classList.add('hiding'); setTimeout(() => t.remove(), 300); }, 3500);
  }

  // ── Load quiz ─────────────────────────────────────────────────────
  if (!quizId) { document.body.innerHTML = '<div style="text-align:center;padding:4rem"><h2>Quiz não encontrado.</h2></div>'; }

  const snap = await getDoc(doc(db, 'quizzes', quizId));
  if (!snap.exists() || (snap.data().status !== 'active' && !isPreview)) {
    document.getElementById('loadingOverlay').style.display = 'none';
    document.body.innerHTML = `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;padding:2rem">
      <h2>Este quiz não está disponível.</h2>
      <p style="color:#6B7A99">Verifique o link ou entre em contato com quem te enviou.</p>
    </div>`;
    throw new Error('Quiz unavailable');
  }

  quizData  = { id: snap.id, ...snap.data() };
  questions = quizData.questions || [];

  // ── Meta Pixel ────────────────────────────────────────────────────
  const pixelId = quizData.settings?.pixelId;
  if (pixelId && !isPreview) {
    const script = document.createElement('script');
    script.textContent = `!function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');fbq('init','${pixelId}');fbq('track','PageView');`;
    document.head.appendChild(script);
  }

  // ── Título ────────────────────────────────────────────────────────
  document.title = quizData.title || 'Quiz';
  document.getElementById('startTitle').textContent  = quizData.title  || 'Diagnóstico';
  document.getElementById('startDesc').textContent   = quizData.description || '';
  document.getElementById('quizQCount').textContent  = `${questions.length} perguntas`;
  document.getElementById('progressTitle').textContent = quizData.title || '';
  const minutos = Math.max(1, Math.ceil(questions.length * 0.4));
  document.getElementById('quizDuration').textContent = `~${minutos} min`;

  // ── Auto-save local (prevenção de abandono) ───────────────────────
  function saveLocal() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ currentIdx, answers, sessionId }));
    } catch(e) {}
  }

  function loadLocal() {
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
      if (saved && saved.sessionId) {
        currentIdx = saved.currentIdx || 0;
        answers    = saved.answers    || {};
        sessionId  = saved.sessionId;
        return true;
      }
    } catch(e) {}
    return false;
  }

  function clearLocal() {
    try { localStorage.removeItem(STORAGE_KEY); } catch(e) {}
  }

  // ── Drop-off tracking ─────────────────────────────────────────────
  async function registerDropoff(questionId) {
    if (isPreview || dropoffRegistered) return;
    try {
      await addDoc(collection(db, 'dropoffs'), {
        quizId, questionId,
        sessionId,
        createdAt: serverTimestamp()
      });
      // Incrementa contador no quiz
      await updateDoc(doc(db, 'quizzes', quizId), {
        [`stats.dropoffs.${questionId}`]: increment(1)
      });
    } catch(e) {}
  }

  // Detecta fechamento/abandono
  window.addEventListener('beforeunload', () => {
    if (currentIdx > 0 && currentIdx < questions.length) {
      const q = getCurrentQuestion();
      if (q) registerDropoff(q.id);
    }
  });

  // ── Lógica de qual pergunta mostrar ──────────────────────────────
  // Retorna o índice (na lista questions) a partir do currentIdx
  // levando em conta jumpTo das respostas dadas
  let questionPath = []; // path de IDs já visitados

  function startPath() {
    questionPath = questions.length > 0 ? [questions[0].id] : [];
  }

  function getCurrentQuestion() {
    const id = questionPath[currentIdx];
    return questions.find(q => q.id === id);
  }

  function getNextQuestionId() {
    const currentQ = getCurrentQuestion();
    if (!currentQ) return null;

    const ans = answers[currentQ.id];
    // Verifica jumpTo da opção escolhida
    if (ans?.optionId) {
      const opt = (currentQ.options || []).find(o => o.id === ans.optionId);
      if (opt?.jumpTo === '__result__') return '__result__';
      if (opt?.jumpTo) return opt.jumpTo;
    }
    // Próxima sequencial
    const currentIdx2 = questions.findIndex(q => q.id === currentQ.id);
    return questions[currentIdx2 + 1]?.id || null;
  }

  // ── Render question ───────────────────────────────────────────────
  const motivations = [
    'Continue! Você está indo muito bem! 💪',
    'Quase lá! Cada resposta revela mais sobre você.',
    'Falta pouco! Seu diagnóstico personalizado está chegando!',
    'Incrível progresso! Você está quase no final!',
    'Última etapa! Prepare-se para o seu resultado.'
  ];

  function render() {
    const q = getCurrentQuestion();
    if (!q) return;

    const total   = questionPath.length;
    const current = currentIdx + 1;
    const pct     = Math.round((currentIdx / Math.max(questionPath.length, questions.length)) * 100);

    document.getElementById('progressCounter').textContent = `${current} de ${Math.max(total, questions.length)}`;
    document.getElementById('progressBar').style.width = `${pct}%`;

    // Mensagem motivacional
    const motIdx = Math.floor((currentIdx / Math.max(questions.length - 1, 1)) * (motivations.length - 1));
    document.getElementById('motivationText').textContent = currentIdx > 0 ? motivations[motIdx] : '';

    // Botão voltar
    document.getElementById('prevBtn').style.display = currentIdx > 0 ? 'flex' : 'none';

    // Botão próximo
    const nextBtn = document.getElementById('nextBtn');
    const isLast  = getNextQuestionId() === null || getNextQuestionId() === '__result__';
    nextBtn.innerHTML = isLast
      ? `Ver meu Resultado <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="5 3 19 12 5 21 5 3"/></svg>`
      : `Próxima <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>`;

    // Conteúdo da pergunta
    const area = document.getElementById('questionArea');
    const optLetters = ['A','B','C','D','E','F'];
    const selectedOptId = answers[q.id]?.optionId;

    let mediaHtml = '';
    if (q.mediaUrl) {
      const isVideo = /\.(mp4|webm|ogg)$/i.test(q.mediaUrl) || q.mediaType === 'video';
      const isAudio = /\.(mp3|wav|ogg)$/i.test(q.mediaUrl) || q.mediaType === 'audio';
      if (isVideo)
        mediaHtml = `<div class="question-media"><video src="${q.mediaUrl}" autoplay muted loop playsinline controls style="width:100%"></video></div>`;
      else if (isAudio)
        mediaHtml = `<div class="question-media" style="padding:16px"><audio src="${q.mediaUrl}" controls style="width:100%"></audio></div>`;
      else
        mediaHtml = `<div class="question-media"><img src="${q.mediaUrl}" alt="" loading="lazy"/></div>`;
    }

    let optionsHtml = '';
    if (q.type === 'text') {
      const val = answers[q.id]?.textAnswer || '';
      optionsHtml = `<textarea class="form-input text-answer-input" id="textAnswer" placeholder="Digite sua resposta aqui…">${val}</textarea>`;
    } else {
      const opts = (q.options || []).map((o, i) => `
        <button class="option-btn ${selectedOptId === o.id ? 'selected' : ''}"
          data-id="${o.id}" data-score="${o.score||0}" data-profile="${o.profile||''}"
          onclick="selectOption('${q.id}', '${o.id}', ${o.score||0}, '${o.profile||''}')">
          <span class="option-key">${optLetters[i] || i+1}</span>
          <span>${o.text || ''}</span>
        </button>`).join('');
      optionsHtml = `<div class="options-list">${opts}</div>
        <div class="keyboard-hint">Pressione A, B, C… ou ↑↓ para navegar · Enter para confirmar</div>`;
    }

    area.innerHTML = `
      <div class="animate-in">
        ${mediaHtml}
        <div class="question-text">${q.text || ''}</div>
        ${optionsHtml}
      </div>`;

    saveLocal();
  }

  // ── Selecionar opção ──────────────────────────────────────────────
  window.selectOption = (qId, optId, score, profile) => {
    answers[qId] = { optionId: optId, score, profile };
    render();
    // Auto-avança após breve delay se tiver jump configurado
    setTimeout(() => {
      const q = getCurrentQuestion();
      if (!q) return;
      const opt = (q.options || []).find(o => o.id === optId);
      if (opt?.jumpTo) handleNext();
    }, 350);
  };

  // ── Atalhos de teclado ────────────────────────────────────────────
  document.addEventListener('keydown', e => {
    if (!document.getElementById('quizScreen').style.display || document.getElementById('quizScreen').style.display === 'none') return;
    const q = getCurrentQuestion();
    if (!q || q.type === 'text') return;
    const optLetters = ['A','B','C','D','E','F'];
    const idx2 = optLetters.indexOf(e.key.toUpperCase());
    if (idx2 >= 0 && idx2 < (q.options || []).length) {
      const opt = q.options[idx2];
      selectOption(q.id, opt.id, opt.score || 0, opt.profile || '');
    }
    if (e.key === 'Enter') handleNext();
    if (e.key === 'ArrowRight') handleNext();
    if (e.key === 'ArrowLeft' && currentIdx > 0) handlePrev();
  });

  // ── Navegação ─────────────────────────────────────────────────────
  function handleNext() {
    const q = getCurrentQuestion();
    if (!q) return;

    if (q.type === 'text') {
      const val = document.getElementById('textAnswer')?.value?.trim();
      if (val) answers[q.id] = { textAnswer: val, score: 0, profile: '' };
    }

    if (!answers[q.id] && q.required) {
      toast('Selecione uma opção para continuar.', 'warning');
      document.getElementById('questionArea').style.animation = 'none';
      setTimeout(() => document.getElementById('questionArea').style.animation = '', 10);
      return;
    }

    const nextId = getNextQuestionId();

    if (!nextId || nextId === '__result__') {
      // Fim do quiz
      handleFinish();
      return;
    }

    // Adiciona próxima pergunta ao path
    if (questionPath[currentIdx + 1] !== nextId) {
      questionPath = questionPath.slice(0, currentIdx + 1);
      questionPath.push(nextId);
    }
    currentIdx++;
    render();
  }

  function handlePrev() {
    if (currentIdx <= 0) return;
    currentIdx--;
    render();
  }

  document.getElementById('nextBtn').addEventListener('click', handleNext);
  document.getElementById('prevBtn').addEventListener('click', handlePrev);

  // ── Calcular resultado ────────────────────────────────────────────
  function calcResult() {
    const scoring = quizData.scoring || {};
    const type    = scoring.type || 'score';

    if (type === 'profile') {
      // Conta qual perfil apareceu mais
      const counts = { A: 0, B: 0, C: 0, D: 0 };
      Object.values(answers).forEach(a => { if (a.profile) counts[a.profile] = (counts[a.profile] || 0) + 1; });
      const winner = Object.entries(counts).sort((a,b) => b[1]-a[1])[0];
      const profile = winner?.[0] || 'A';
      const result  = (scoring.results || []).find(r => r.profile === profile);
      return { type: 'profile', profile, score: null, result };

    } else if (type === 'weighted') {
      // Soma por eixo
      const axisScores = {};
      (scoring.axes || []).forEach(a => { axisScores[a.key] = 0; });
      Object.values(answers).forEach(a => {
        if (a.axisScores) {
          Object.entries(a.axisScores).forEach(([k,v]) => { axisScores[k] = (axisScores[k]||0) + v; });
        } else if (a.score) {
          Object.keys(axisScores).forEach(k => { axisScores[k] += a.score / Object.keys(axisScores).length; });
        }
      });
      const total  = Object.values(axisScores).reduce((s,v) => s+v, 0);
      const result = (scoring.results || []).find(r => total >= r.minScore && total <= r.maxScore);
      return { type: 'weighted', axisScores, score: total, result };

    } else {
      // Score simples
      const total = Object.values(answers).reduce((s,a) => s + (a.score||0), 0);
      const result = (scoring.results || []).find(r => total >= r.minScore && total <= r.maxScore)
        || (scoring.results || [])[0];
      return { type: 'score', score: total, result };
    }
  }

  // ── Finalizar quiz ────────────────────────────────────────────────
  async function handleFinish() {
    const result = calcResult();

    // Registra início no Firestore (sem dados pessoais ainda)
    if (!isPreview) {
      try {
        if (!responseDocId) {
          const ref = await addDoc(collection(db, 'responses'), {
            quizId,
            sessionId,
            createdAt: serverTimestamp(),
            utms,
            answers: Object.entries(answers).map(([qId, ans]) => ({ questionId: qId, ...ans })),
            score:   result.score,
            profile: result.profile || null,
            resultId: result.result?.id || null,
            completed: false,
            lead: null
          });
          responseDocId = ref.id;
          await updateDoc(doc(db, 'quizzes', quizId), {
            'stats.totalResponses': increment(1)
          });
        }
      } catch(e) { console.warn('Firestore response create failed:', e); }
    }

    // Persiste resultado para a gate/result screen
    sessionStorage.setItem('4quiz_result', JSON.stringify({
      quizId, responseDocId,
      result, answers, utms, sessionId
    }));

    // Verificar se gate está ativa
    if (quizData.settings?.activeGate !== false && !isPreview) {
      showGate();
    } else {
      goToResult();
    }
  }

  // ── Gate screen ───────────────────────────────────────────────────
  function showGate() {
    document.getElementById('quizScreen').style.display = 'none';
    const gate = document.getElementById('gateScreen');
    gate.style.display = 'flex';

    // Pixel event
    if (pixelId && window.fbq) fbq('track', 'Lead');
  }

  document.getElementById('gateSubmitBtn').addEventListener('click', async () => {
    const name     = document.getElementById('gateName').value.trim();
    const email    = document.getElementById('gateEmail').value.trim();
    const whatsapp = document.getElementById('gateWhatsapp').value.trim();

    if (!name || !email || !whatsapp) {
      toast('Preencha todos os campos.', 'error'); return;
    }
    if (!/\S+@\S+\.\S+/.test(email)) {
      toast('E-mail inválido.', 'error'); return;
    }

    const btn = document.getElementById('gateSubmitBtn');
    btn.disabled = true;
    btn.textContent = 'Processando…';

    const saved = JSON.parse(sessionStorage.getItem('4quiz_result') || '{}');
    const lead  = { name, email, whatsapp };

    try {
      // Atualiza resposta com dados do lead
      if (responseDocId) {
        await updateDoc(doc(db, 'responses', responseDocId), {
          lead,
          completed: true,
          completedAt: serverTimestamp()
        });
        await updateDoc(doc(db, 'quizzes', quizId), {
          'stats.completions': increment(1)
        });
      }
    } catch(e) { console.warn(e); }

    // Salva lead para a página de resultado
    sessionStorage.setItem('4quiz_lead', JSON.stringify(lead));
    clearLocal();
    goToResult();
  });

  function goToResult() {
    window.location.href = `/result.html?id=${quizId}`;
  }

  // ── Start ─────────────────────────────────────────────────────────
  document.getElementById('startBtn').addEventListener('click', () => {
    document.getElementById('startScreen').style.display = 'none';
    document.getElementById('quizScreen').style.display  = 'block';

    // Restaura progresso salvo?
    const hadProgress = loadLocal();
    startPath();
    if (hadProgress && questionPath.length === 0) startPath();

    render();
  });

  // Mostrar tela inicial
  document.getElementById('loadingOverlay').style.display = 'none';
  document.getElementById('startScreen').style.display    = 'flex';
</script>
</body>
