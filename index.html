<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>4quiz · Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/main.css"/>
  <style>
    body { background: var(--grad-hero); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: var(--space-md); }

    .login-box {
      background: var(--white);
      border-radius: var(--radius-lg);
      padding: var(--space-2xl) var(--space-xl);
      width: 100%;
      max-width: 420px;
      box-shadow: var(--shadow-lg);
      animation: fadeInUp 0.45s cubic-bezier(0.4,0,0.2,1) both;
    }

    .login-logo {
      text-align: center;
      margin-bottom: var(--space-xl);
    }
    .login-logo h1 {
      font-size: 2.4rem;
      font-weight: 800;
      color: var(--blue-primary);
      letter-spacing: -1px;
    }
    .login-logo h1 span { color: var(--yellow-cta); }
    .login-logo p { color: var(--text-muted); font-size: 0.92rem; margin-top: 6px; }

    .login-form { display: flex; flex-direction: column; gap: var(--space-md); }

    .login-error {
      background: #FEE2E2;
      color: #991B1B;
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      font-size: 0.88rem;
      font-weight: 500;
      display: none;
    }

    .login-footer {
      text-align: center;
      margin-top: var(--space-lg);
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .password-wrap { position: relative; }
    .password-wrap .toggle-pw {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
    }
    .password-wrap .form-input { padding-right: 42px; }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="login-logo">
      <h1>4<span>quiz</span></h1>
      <p>Plataforma de Diagnóstico Inteligente</p>
    </div>

    <form class="login-form" id="loginForm" novalidate>
      <div class="login-error" id="loginError"></div>

      <div class="form-group">
        <label class="form-label" for="email">E-mail</label>
        <input
          type="email"
          id="email"
          class="form-input"
          placeholder="equipemkt@4blue.com.br"
          autocomplete="email"
          required
        />
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Senha</label>
        <div class="password-wrap">
          <input
            type="password"
            id="password"
            class="form-input"
            placeholder="••••••••"
            autocomplete="current-password"
            required
          />
          <button type="button" class="toggle-pw" id="togglePw" aria-label="Ver senha">
            <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-full btn-lg" id="loginBtn">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
        Entrar no Dashboard
      </button>
    </form>

    <div class="login-footer">
      Acesso restrito · Equipe 4blue
    </div>
  </div>

  <div id="toast-container"></div>

  <script type="module">
    import { auth, ADMIN_EMAIL } from '/js/firebase-config.js';
    import {
      signInWithEmailAndPassword,
      onAuthStateChanged
    } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';

    // Redireciona se já logado
    onAuthStateChanged(auth, user => {
      if (user && user.email === ADMIN_EMAIL) {
        window.location.href = '/dashboard.html';
      }
    });

    const form      = document.getElementById('loginForm');
    const emailIn   = document.getElementById('email');
    const passIn    = document.getElementById('password');
    const loginBtn  = document.getElementById('loginBtn');
    const errorBox  = document.getElementById('loginError');
    const togglePw  = document.getElementById('togglePw');

    // Toggle mostrar/ocultar senha
    togglePw.addEventListener('click', () => {
      const isPass = passIn.type === 'password';
      passIn.type  = isPass ? 'text' : 'password';
      togglePw.innerHTML = isPass
        ? `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`
        : `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
    });

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.style.display = 'block';
    }
    function hideError() { errorBox.style.display = 'none'; }

    form.addEventListener('submit', async e => {
      e.preventDefault();
      hideError();

      const email    = emailIn.value.trim();
      const password = passIn.value;

      if (!email || !password) {
        showError('Preencha e-mail e senha.');
        return;
      }

      if (email !== ADMIN_EMAIL) {
        showError('Acesso não autorizado para este e-mail.');
        return;
      }

      loginBtn.disabled = true;
      loginBtn.innerHTML = '<div class="spinner" style="width:20px;height:20px;border-width:2px"></div> Entrando…';

      try {
        await signInWithEmailAndPassword(auth, email, password);
        window.location.href = '/dashboard.html';
      } catch (err) {
        const msgs = {
          'auth/user-not-found':   'Usuário não encontrado.',
          'auth/wrong-password':   'Senha incorreta. Tente novamente.',
          'auth/invalid-credential': 'E-mail ou senha inválidos.',
          'auth/too-many-requests': 'Muitas tentativas. Aguarde alguns minutos.',
        };
        showError(msgs[err.code] || 'Erro ao entrar. Verifique suas credenciais.');
      } finally {
        loginBtn.disabled = false;
        loginBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg> Entrar no Dashboard`;
      }
    });
  </script>
</body>
</html>
